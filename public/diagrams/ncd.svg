  <text x="240" y="462" text-anchor="middle" fill="#e8e8ed" font-size="13" font-weight="700">Equipment and technique</text>
  <text x="240" y="482" text-anchor="middle" fill="#aaa" font-size="11">14-gauge catheter-over-needle, 3.25 inch minimum length</text>
  <text x="240" y="500" text-anchor="middle" fill="#aaa" font-size="11">Insert perpendicular to chest wall, above the target rib</text>
  <text x="240" y="518" text-anchor="middle" fill="#aaa" font-size="11">Remove needle, leave catheter in place, secure with tape</text>
  <text x="240" y="536" text-anchor="middle" fill="#888" font-size="11">May need to repeat if catheter kinks or symptoms recur</text>

  <text x="240" y="575" text-anchor="middle" fill="#444" font-size="9">medeor.app | Content per JTS CPG &amp; CoTCCC guidelines</text>
