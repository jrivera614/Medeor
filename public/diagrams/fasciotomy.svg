<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 740">
  <style>text { font-family: system-ui, sans-serif; }</style>
  <rect width="480" height="740" fill="#0d0d14" rx="14"/>

  <text x="240" y="30" text-anchor="middle" fill="#e8e8ed" font-size="15" font-weight="700" letter-spacing="0.04em">LOWER LEG FASCIOTOMY</text>
  <text x="240" y="48" text-anchor="middle" fill="#666" font-size="10">Two-Incision Technique | Anterior View</text>

  <!-- Lower leg outline -->
  <path d="M168 80 Q155 85 148 100 Q140 130 138 180 Q136 240 138 300 Q140 340 145 370 Q150 395 160 410 L190 416 Q210 420 240 422 L270 420 Q290 416 310 410 Q320 395 325 370 Q330 340 332 300 Q334 240 332 180 Q330 130 322 100 Q315 85 302 80 Q275 72 240 70 Q205 72 168 80 Z" fill="#1a1a24" stroke="#444" stroke-width="2"/>

  <!-- Patella -->
  <ellipse cx="240" cy="92" rx="32" ry="16" fill="#2a2520" stroke="#665840" stroke-width="1.2"/>
  <text x="240" y="97" text-anchor="middle" fill="#998070" font-size="9">Patella</text>

  <!-- Tibial crest -->
  <line x1="232" y1="114" x2="226" y2="390" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <text x="204" y="255" text-anchor="end" fill="#666" font-size="9" transform="rotate(-88 204 255)">Tibial crest</text>

  <!-- Fibular head -->
  <ellipse cx="318" cy="105" rx="9" ry="7" fill="#2a2520" stroke="#665840" stroke-width="1.2"/>
  <text x="335" y="100" fill="#888" font-size="9">Fibular</text>
  <text x="335" y="112" fill="#888" font-size="9">head</text>

  <!-- Lateral malleolus -->
  <ellipse cx="310" cy="405" rx="8" ry="6" fill="#2a2520" stroke="#665840" stroke-width="1"/>
  <text x="326" y="408" fill="#888" font-size="8">Lat mal</text>

  <!-- Medial malleolus -->
  <ellipse cx="175" cy="408" rx="8" ry="6" fill="#2a2520" stroke="#665840" stroke-width="1"/>
  <text x="157" y="411" text-anchor="end" fill="#888" font-size="8">Med mal</text>

  <!-- LATERAL INCISION -->
  <line x1="300" y1="118" x2="296" y2="398" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300" cy="118" r="4.5" fill="#ef4444"/>
  <circle cx="296" cy="398" r="4.5" fill="#ef4444"/>

  <!-- MEDIAL INCISION -->
  <line x1="195" y1="122" x2="190" y2="400" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <circle cx="195" cy="122" r="4.5" fill="#ef4444"/>
  <circle cx="190" cy="400" r="4.5" fill="#ef4444"/>

  <!-- Lateral label -->
  <text x="380" y="240" fill="#ef4444" font-size="12" font-weight="700">Lateral</text>
  <text x="380" y="256" fill="#aaa" font-size="10">2cm anterior</text>
  <text x="380" y="270" fill="#aaa" font-size="10">to fibula</text>
  <line x1="373" y1="255" x2="308" y2="255" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="4 3"/>

  <!-- Medial label -->
  <text x="90" y="240" text-anchor="end" fill="#ef4444" font-size="12" font-weight="700">Medial</text>
  <text x="90" y="256" text-anchor="end" fill="#aaa" font-size="10">2cm posterior</text>
  <text x="90" y="270" text-anchor="end" fill="#aaa" font-size="10">to tibia</text>
  <line x1="97" y1="255" x2="187" y2="255" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="4 3"/>

  <!-- What each releases -->
  <text x="380" y="300" fill="#888" font-size="9">Releases: anterior</text>
  <text x="380" y="314" fill="#888" font-size="9">+ lateral comps</text>
  <text x="90" y="300" text-anchor="end" fill="#888" font-size="9">Releases: deep +</text>
  <text x="90" y="314" text-anchor="end" fill="#888" font-size="9">superficial post</text>

  <!-- 5 P's box -->
  <rect x="18" y="440" width="444" height="82" rx="10" fill="#10b98110" stroke="#10b981" stroke-width="0.5"/>
  <text x="240" y="462" text-anchor="middle" fill="#10b981" font-size="13" font-weight="700">5 P's of Compartment Syndrome</text>
  <text x="240" y="482" text-anchor="middle" fill="#aaa" font-size="11">Pain (out of proportion, with passive stretch) -- earliest sign</text>
  <text x="240" y="498" text-anchor="middle" fill="#aaa" font-size="10">Pressure (firm compartment), Paresthesias, Paralysis</text>
  <text x="240" y="514" text-anchor="middle" fill="#888" font-size="10">Pulselessness (LATE finding -- do NOT wait for this)</text>

  <!-- Technique box -->
  <rect x="18" y="536" width="444" height="110" rx="10" fill="#ffffff08" stroke="#ffffff14" stroke-width="1"/>
  <text x="240" y="558" text-anchor="middle" fill="#e8e8ed" font-size="13" font-weight="700">Technique</text>
  <text x="240" y="578" text-anchor="middle" fill="#aaa" font-size="11">1. Full-length incision through skin and fascia.</text>
  <text x="240" y="594" text-anchor="middle" fill="#aaa" font-size="11">2. Each incision 15-20cm. Do NOT cut muscle.</text>
  <text x="240" y="610" text-anchor="middle" fill="#aaa" font-size="11">3. Forearm: dorsal + volar incisions.</text>
  <text x="240" y="626" text-anchor="middle" fill="#aaa" font-size="11">4. Thigh: lateral incision through IT band.</text>
  <text x="240" y="640" text-anchor="middle" fill="#888" font-size="10">Leave wounds open. Wet saline dressings. Consult telemedicine.</text>

  <!-- Red flags -->
  <rect x="18" y="660" width="444" height="56" rx="10" fill="#ef444410" stroke="#ef4444" stroke-width="0.5"/>
  <text x="240" y="678" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">Pressure >30 mmHg or within 30 of diastolic = emergent</text>
  <text x="240" y="694" text-anchor="middle" fill="#ef4444" font-size="10">Avoid: saphenous vein/nerve (medial), superficial peroneal nerve (lateral)</text>
  <text x="240" y="710" text-anchor="middle" fill="#888" font-size="9">Irreversible procedure. Reassess perfusion after release.</text>

  <text x="240" y="733" text-anchor="middle" fill="#444" font-size="9">medeor.app | Content per JTS CPG &amp; CoTCCC guidelines</text>
</svg>