<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420">
  <style>text { font-family: system-ui, sans-serif; }</style>
  <rect width="480" height="420" fill="#0d0d14" rx="14"/>

  <text x="240" y="30" text-anchor="middle" fill="#e8e8ed" font-size="15" font-weight="700" letter-spacing="0.04em">LOWER LEG FASCIOTOMY</text>
  <text x="240" y="48" text-anchor="middle" fill="#666" font-size="10">Two-Incision Technique | Cross-Section</text>

  <!-- Skin outline -->
  <ellipse cx="240" cy="210" rx="155" ry="120" fill="#1a1a24" stroke="#444" stroke-width="2"/>

  <!-- Tibia -->
  <path d="M195 130 L275 130 L235 210 Z" fill="#2a2520" stroke="#665840" stroke-width="1.5"/>
  <text x="235" y="170" text-anchor="middle" fill="#998070" font-size="13" font-weight="600">Tibia</text>

  <!-- Fibula -->
  <circle cx="340" cy="220" r="16" fill="#2a2520" stroke="#665840" stroke-width="1.5"/>
  <text x="340" y="225" text-anchor="middle" fill="#998070" font-size="9">Fib</text>

  <!-- IO membrane -->
  <line x1="250" y1="200" x2="325" y2="215" stroke="#665840" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- ANTERIOR compartment -->
  <path d="M195 130 Q240 95 350 150 L325 215 L250 200 L235 210 Z" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="275" y="148" fill="#3b82f6" font-size="13" font-weight="600">Anterior</text>

  <!-- LATERAL compartment -->
  <path d="M350 150 Q385 175 380 240 L340 236 L325 215 Z" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.2"/>
  <text x="358" y="198" fill="#10b981" font-size="11" font-weight="600">Lat</text>

  <!-- DEEP POSTERIOR -->
  <path d="M235 210 L250 200 L325 215 L340 236 Q300 275 205 265 Z" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="270" y="250" fill="#f59e0b" font-size="11" font-weight="600">Deep Post</text>

  <!-- SUPERFICIAL POSTERIOR -->
  <path d="M205 265 Q300 275 380 240 Q392 270 370 305 Q300 330 155 308 Q130 275 155 240 Z" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="1.2"/>
  <text x="268" y="300" fill="#a855f7" font-size="11" font-weight="600">Superficial Post</text>

  <!-- LATERAL INCISION -->
  <line x1="370" y1="110" x2="370" y2="165" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <circle cx="370" cy="110" r="5" fill="#ef4444"/>
  <text x="400" y="118" fill="#ef4444" font-size="12" font-weight="700">Lateral</text>
  <text x="400" y="134" fill="#aaa" font-size="10">2cm anterior</text>
  <text x="400" y="148" fill="#aaa" font-size="10">to fibula</text>

  <!-- MEDIAL INCISION -->
  <line x1="130" y1="195" x2="130" y2="250" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <circle cx="130" cy="195" r="5" fill="#ef4444"/>
  <text x="42" y="208" fill="#ef4444" font-size="12" font-weight="700">Medial</text>
  <text x="42" y="224" fill="#aaa" font-size="10">2cm posterior</text>
  <text x="42" y="238" fill="#aaa" font-size="10">to tibia</text>

  <!-- Bottom summary -->
  <text x="240" y="365" text-anchor="middle" fill="#aaa" font-size="11">Lateral releases anterior + lateral. Medial releases deep + superficial posterior.</text>
  <text x="240" y="385" text-anchor="middle" fill="#888" font-size="10">Full-length incisions through skin and fascia. Do not cut muscle.</text>

  <text x="240" y="410" text-anchor="middle" fill="#444" font-size="9">medeor.app | Content per JTS CPG &amp; CoTCCC guidelines</text>
</svg>