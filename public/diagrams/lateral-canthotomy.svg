<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680">
  <style>text { font-family: system-ui, sans-serif; }</style>
  <rect width="480" height="680" fill="#0d0d14" rx="14"/>

  <text x="240" y="30" text-anchor="middle" fill="#e8e8ed" font-size="15" font-weight="700" letter-spacing="0.04em">LATERAL CANTHOTOMY</text>
  <text x="240" y="46" text-anchor="middle" fill="#666" font-size="10">ORBITAL COMPARTMENT SYNDROME RELEASE</text>

  <!-- Eye anatomy - frontal view -->
  <text x="170" y="72" text-anchor="middle" fill="#888" font-size="11" font-weight="500">Frontal Anatomy</text>

  <!-- Orbital rim -->
  <ellipse cx="170" cy="175" rx="90" ry="60" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="170" y="248" text-anchor="middle" fill="#444" font-size="9">Orbital rim</text>

  <!-- Eyelid (almond shape) -->
  <path d="M85 175 Q125 132 170 128 Q215 132 255 175 Q215 218 170 222 Q125 218 85 175 Z" fill="#1a1a24" stroke="#555" stroke-width="1.2"/>

  <!-- Iris/pupil -->
  <circle cx="170" cy="173" r="26" fill="#1e3a2e" stroke="#2a5a3a" stroke-width="0.8"/>
  <circle cx="170" cy="173" r="13" fill="#111"/>
  <circle cx="164" cy="168" r="3.5" fill="#ffffff15"/>

  <!-- Upper lid crease -->
  <path d="M98 170 Q132 142 170 138 Q208 142 242 170" fill="none" stroke="#444" stroke-width="0.8"/>

  <!-- Lateral canthus (target) -->
  <circle cx="255" cy="175" r="7" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Medial canthus -->
  <circle cx="85" cy="175" r="4" fill="#444" fill-opacity="0.3" stroke="#555" stroke-width="1"/>
  <text x="66" y="168" text-anchor="end" fill="#888" font-size="9">Medial</text>
  <text x="66" y="180" text-anchor="end" fill="#888" font-size="9">canthus</text>

  <!-- Superior crus -->
  <line x1="255" y1="160" x2="275" y2="168" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="218" y="148" text-anchor="end" fill="#3b82f6" font-size="10">Superior crus</text>

  <!-- Inferior crus (CUT TARGET) -->
  <line x1="255" y1="190" x2="275" y2="182" stroke="#ef4444" stroke-width="2.5"/>
  <text x="218" y="210" text-anchor="end" fill="#ef4444" font-size="10" font-weight="600">Inferior crus</text>
  <text x="218" y="224" text-anchor="end" fill="#ef4444" font-size="9">CUT HERE</text>

  <!-- Canthal tendon to orbital rim -->
  <line x1="275" y1="168" x2="290" y2="173" stroke="#555" stroke-width="1.5"/>
  <line x1="275" y1="182" x2="290" y2="177" stroke="#555" stroke-width="1.5"/>
  <line x1="290" y1="173" x2="290" y2="177" stroke="#555" stroke-width="1.5"/>
  <line x1="290" y1="175" x2="306" y2="175" stroke="#555" stroke-width="1"/>
  <text x="310" y="179" fill="#888" font-size="9">Lat. orbital rim</text>

  <!-- Lateral canthus label -->
  <text x="272" y="155" fill="#ef4444" font-size="10" font-weight="600">Lateral</text>
  <text x="272" y="167" fill="#ef4444" font-size="10" font-weight="600">canthus</text>

  <!-- Hemostat crush line indicator -->
  <line x1="255" y1="175" x2="285" y2="175" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  <text x="298" y="175" fill="#f59e0b" font-size="9" font-weight="600">Crush line</text>

  <!-- Callout boxes -->
  <rect x="350" y="82" width="122" height="68" rx="8" fill="#ffffff08" stroke="#ffffff14" stroke-width="1"/>
  <text x="411" y="101" text-anchor="middle" fill="#e8e8ed" font-size="12" font-weight="700">Indications</text>
  <text x="411" y="117" text-anchor="middle" fill="#aaa" font-size="10">Proptosis + vision loss</text>
  <text x="411" y="131" text-anchor="middle" fill="#aaa" font-size="10">Tense orbit, APD</text>
  <text x="411" y="145" text-anchor="middle" fill="#888" font-size="9">IOP >40 mmHg</text>

  <rect x="350" y="230" width="122" height="42" rx="8" fill="#ef444410" stroke="#ef4444" stroke-width="1"/>
  <text x="411" y="249" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">90-120 min window</text>
  <text x="411" y="265" text-anchor="middle" fill="#ef4444" font-size="9">Retinal ischemia</text>

  <!-- Key anatomy box -->
  <rect x="18" y="280" width="444" height="65" rx="10" fill="#ffffff08" stroke="#ffffff14" stroke-width="1"/>
  <text x="240" y="302" text-anchor="middle" fill="#e8e8ed" font-size="12" font-weight="700">Key Anatomy</text>
  <text x="240" y="320" text-anchor="middle" fill="#aaa" font-size="10">Lateral canthal tendon splits into superior and inferior crus</text>
  <text x="240" y="336" text-anchor="middle" fill="#aaa" font-size="10">attaching to the lateral orbital rim periosteum.</text>

  <!-- Technique box -->
  <rect x="18" y="360" width="444" height="200" rx="10" fill="#ffffff08" stroke="#ffffff14" stroke-width="1"/>
  <text x="240" y="382" text-anchor="middle" fill="#e8e8ed" font-size="13" font-weight="700">Technique</text>
  <text x="240" y="402" text-anchor="middle" fill="#aaa" font-size="11">1. Identify lateral canthus.</text>
  <text x="240" y="420" text-anchor="middle" fill="#aaa" font-size="11">2. Infiltrate with lidocaine 1% + epi if time allows.</text>
  <text x="240" y="438" text-anchor="middle" fill="#aaa" font-size="11">3. Crush lateral canthus with hemostat (hemostasis).</text>
  <text x="240" y="456" text-anchor="middle" fill="#aaa" font-size="11">4. Cut full thickness through crushed tissue (1-2 cm).</text>
  <text x="240" y="474" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">5. Strum for inferior crus (taut band). Cut it first.</text>
  <text x="240" y="492" text-anchor="middle" fill="#aaa" font-size="11">6. Reassess. If no improvement, cut superior crus.</text>
  <text x="240" y="510" text-anchor="middle" fill="#aaa" font-size="11">7. Globe should decompress and retract.</text>
  <text x="240" y="534" text-anchor="middle" fill="#888" font-size="10">Consult telemedicine. Do NOT cut medially.</text>
  <text x="240" y="552" text-anchor="middle" fill="#888" font-size="10">Most time-critical PFC procedure.</text>

  <!-- Equipment box -->
  <rect x="18" y="575" width="210" height="60" rx="10" fill="#ffffff08" stroke="#ffffff14" stroke-width="1"/>
  <text x="123" y="597" text-anchor="middle" fill="#e8e8ed" font-size="12" font-weight="700">Equipment</text>
  <text x="123" y="613" text-anchor="middle" fill="#aaa" font-size="10">Hemostat, iris scissors</text>
  <text x="123" y="627" text-anchor="middle" fill="#aaa" font-size="10">Lidocaine 1% + epi</text>

  <!-- Confirm box -->
  <rect x="244" y="575" width="218" height="60" rx="10" fill="#ffffff08" stroke="#ffffff14" stroke-width="1"/>
  <text x="353" y="597" text-anchor="middle" fill="#e8e8ed" font-size="12" font-weight="700">Confirm</text>
  <text x="353" y="613" text-anchor="middle" fill="#aaa" font-size="10">Globe retreats into orbit</text>
  <text x="353" y="627" text-anchor="middle" fill="#aaa" font-size="10">Reassess IOP and vision</text>

  <text x="240" y="655" text-anchor="middle" fill="#444" font-size="9">medeor.app | Content per JTS CPG &amp; CoTCCC guidelines</text>
  <text x="240" y="670" text-anchor="middle" fill="#f59e0b" font-size="8" opacity="0.7">Training reference only. Not a substitute for clinical judgment.</text>
</svg>