<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640">
  <!-- Background -->
  <rect width="480" height="640" fill="#f2f1ec" rx="14"/>

  <!-- Title -->
  <text x="240" y="30" text-anchor="middle" fill="#333" font-family="system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="0.04em">SURGICAL CRICOTHYROTOMY</text>
  <text x="240" y="46" text-anchor="middle" fill="#999" font-family="system-ui,sans-serif" font-size="10">ANTERIOR NECK VIEW</text>

  <!-- ======= NECK ======= -->
  <!-- Outer neck -->
  <path d="M 130,78 Q 125,90 120,115 Q 115,150 112,190 Q 108,240 106,290 Q 104,340 102,390 Q 100,420 98,440 L 362,440 Q 360,420 358,390 Q 356,340 354,290 Q 352,240 348,190 Q 345,150 340,115 Q 335,90 330,78" fill="#fff" stroke="#d0d0d0" stroke-width="1.5"/>

  <!-- Jaw -->
  <path d="M 130,78 Q 170,64 210,60 Q 240,58 270,60 Q 310,64 330,78" fill="#fff" stroke="#d0d0d0" stroke-width="1.5"/>

  <!-- Midline -->
  <line x1="230" y1="70" x2="230" y2="440" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- SCM hints -->
  <path d="M 150,85 Q 140,150 132,220 Q 125,290 118,360 Q 114,400 110,440" fill="none" stroke="#e8e8e8" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
  <path d="M 310,85 Q 320,150 328,220 Q 335,290 342,360 Q 346,400 350,440" fill="none" stroke="#e8e8e8" stroke-width="12" stroke-linecap="round" opacity="0.5"/>

  <!-- ======= HYOID BONE ======= -->
  <path d="M 192,102 Q 210,96 230,94 Q 250,96 268,102" fill="none" stroke="#bbb" stroke-width="4" stroke-linecap="round"/>

  <!-- Hyoid label -->
  <text x="80" y="102" text-anchor="end" fill="#888" font-family="system-ui,sans-serif" font-size="11">Hyoid bone</text>
  <line x1="84" y1="100" x2="190" y2="100" stroke="#ddd" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- ======= THYROID CARTILAGE ======= -->
  <path d="M 185,128 L 200,120 Q 215,116 230,114 Q 245,116 260,120 L 275,128 L 278,210 Q 270,218 250,224 Q 230,228 210,224 Q 190,218 182,210 Z" fill="#f0f0f0" stroke="#bbb" stroke-width="2"/>
  <!-- Thyroid notch -->
  <path d="M 218,116 Q 224,122 230,124 Q 236,122 242,116" fill="#f2f1ec" stroke="#bbb" stroke-width="1.5"/>

  <!-- Thyroid label -->
  <text x="80" y="165" text-anchor="end" fill="#444" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Thyroid</text>
  <text x="80" y="180" text-anchor="end" fill="#444" font-family="system-ui,sans-serif" font-size="12" font-weight="600">cartilage</text>
  <line x1="84" y1="172" x2="180" y2="172" stroke="#ddd" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- ======= CRICOTHYROID MEMBRANE (TARGET) ======= -->
  <rect x="200" y="232" width="60" height="24" rx="4" fill="#d94040" fill-opacity="0.15" stroke="#d94040" stroke-width="2.5"/>

  <!-- Incision lines -->
  <line x1="215" y1="240" x2="245" y2="240" stroke="#d94040" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="215" y1="248" x2="245" y2="248" stroke="#d94040" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- CTM label with bracket -->
  <line x1="95" y1="234" x2="95" y2="254" stroke="#d94040" stroke-width="2"/>
  <line x1="92" y1="234" x2="98" y2="234" stroke="#d94040" stroke-width="2"/>
  <line x1="92" y1="254" x2="98" y2="254" stroke="#d94040" stroke-width="2"/>
  <text x="80" y="240" text-anchor="end" fill="#d94040" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Cricothyroid</text>
  <text x="80" y="255" text-anchor="end" fill="#d94040" font-family="system-ui,sans-serif" font-size="12" font-weight="700">membrane</text>
  <line x1="100" y1="244" x2="198" y2="244" stroke="#d94040" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- TARGET label -->
  <text x="230" y="270" text-anchor="middle" fill="#d94040" font-family="system-ui,sans-serif" font-size="9" font-weight="700">TARGET</text>

  <!-- ======= CRICOID CARTILAGE ======= -->
  <path d="M 192,262 Q 210,258 230,257 Q 250,258 268,262 L 270,298 Q 255,304 230,306 Q 205,304 190,298 Z" fill="#f0f0f0" stroke="#bbb" stroke-width="2"/>

  <!-- Cricoid label -->
  <text x="80" y="282" text-anchor="end" fill="#444" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Cricoid</text>
  <text x="80" y="297" text-anchor="end" fill="#444" font-family="system-ui,sans-serif" font-size="12" font-weight="600">cartilage</text>
  <line x1="84" y1="288" x2="188" y2="282" stroke="#ddd" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- ======= TRACHEAL RINGS ======= -->
  <path d="M 196,316 Q 213,312 230,311 Q 247,312 264,316 L 264,334 Q 247,338 230,339 Q 213,338 196,334 Z" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/>

  <path d="M 198,345 Q 214,341 230,340 Q 246,341 262,345 L 262,363 Q 246,367 230,368 Q 214,367 198,363 Z" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/>

  <path d="M 200,373 Q 215,369 230,368 Q 245,369 260,373 L 260,391 Q 245,395 230,396 Q 215,395 200,391 Z" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/>

  <!-- Tracheal rings label -->
  <text x="80" y="352" text-anchor="end" fill="#666" font-family="system-ui,sans-serif" font-size="11">Tracheal</text>
  <text x="80" y="367" text-anchor="end" fill="#666" font-family="system-ui,sans-serif" font-size="11">rings</text>
  <line x1="84" y1="358" x2="194" y2="355" stroke="#ddd" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- ======= RIGHT SIDE CALLOUT BOXES ======= -->

  <!-- Indication -->
  <rect x="350" y="85" width="122" height="55" rx="8" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="411" y="104" text-anchor="middle" fill="#333" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Indication</text>
  <text x="411" y="120" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="11">Can't intubate,</text>
  <text x="411" y="134" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="11">can't oxygenate</text>

  <!-- Landmarks -->
  <rect x="350" y="154" width="122" height="68" rx="8" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="411" y="173" text-anchor="middle" fill="#333" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Landmarks</text>
  <text x="411" y="189" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="11">Thyroid cartilage</text>
  <text x="411" y="204" text-anchor="middle" fill="#d94040" font-family="system-ui,sans-serif" font-size="11" font-weight="600">CTM (soft spot)</text>
  <text x="411" y="218" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="11">Cricoid cartilage</text>

  <!-- Equipment -->
  <rect x="350" y="236" width="122" height="55" rx="8" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="411" y="255" text-anchor="middle" fill="#333" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Equipment</text>
  <text x="411" y="271" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="11">Scalpel, tracheal hook</text>
  <text x="411" y="285" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="11">Cuffed 6.0 ETT</text>

  <!-- Confirm -->
  <rect x="350" y="305" width="122" height="55" rx="8" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="411" y="324" text-anchor="middle" fill="#333" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Confirm</text>
  <text x="411" y="340" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="11">Capnography</text>
  <text x="411" y="354" text-anchor="middle" fill="#999" font-family="system-ui,sans-serif" font-size="10">Chest rise + breath sounds</text>

  <!-- Contraindication -->
  <rect x="350" y="374" width="122" height="48" rx="8" fill="#fff" stroke="#d94040" stroke-width="1"/>
  <text x="411" y="393" text-anchor="middle" fill="#d94040" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Contraindicated</text>
  <text x="411" y="409" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="11">Children &lt;12</text>
  <text x="411" y="420" text-anchor="middle" fill="#999" font-family="system-ui,sans-serif" font-size="9">(use needle cric)</text>

  <!-- ======= BOTTOM TECHNIQUE BOX ======= -->
  <rect x="18" y="455" width="444" height="120" rx="10" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="240" y="477" text-anchor="middle" fill="#333" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Technique</text>
  <text x="240" y="497" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="11">1. Palpate landmarks. Stabilize larynx with non-dominant hand.</text>
  <text x="240" y="515" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="11">2. Vertical 3cm skin incision over membrane.</text>
  <text x="240" y="533" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="11">3. Horizontal stab through membrane. Hook to hold open.</text>
  <text x="240" y="551" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="11">4. Insert cuffed 6.0 ETT. Inflate cuff. Confirm placement.</text>
  <text x="240" y="569" text-anchor="middle" fill="#999" font-family="system-ui,sans-serif" font-size="10">Secure with ties or tape. Monitor continuously.</text>

  <!-- Footer -->
  <text x="240" y="600" text-anchor="middle" fill="#bbb" font-family="system-ui,sans-serif" font-size="9">medeor.app | Content per JTS CPG &amp; CoTCCC guidelines</text>
  <text x="240" y="615" text-anchor="middle" fill="#c0a040" font-family="system-ui,sans-serif" font-size="8">Training reference only. Not a substitute for clinical judgment.</text>
</svg>
